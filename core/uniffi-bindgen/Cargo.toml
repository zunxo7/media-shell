[package]
name = "uniffi-bindgen"
description = "Generates the Kotlin bindings for zcore-ffi (cargo run -p uniffi-bindgen -- generate ...)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
